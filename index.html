<style>
:root{box-sizing:border-box;color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f8d7df;--b1:#fffafb;--b2:#f8d7df;--edge:#ebbcc8;--lcd:#fff6f8;--ink:#55404a;--dim:rgba(85,64,74,.5);--w1:#fffafb;--w2:#fbe6ec;--lab:#b07f8e;--led:#ff6f91;--sh:rgba(150,80,100,.22);--hi:#f8d7df}


*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);padding:0;display:flex;justify-content:center;align-items:center;overflow:hidden;font-family:'Nanum Gothic Coding',monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dev{width:min(100%,430px);height:100%;display:flex;flex-direction:column;gap:14px;padding:16px 16px 22px;background:var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 0}
.brand{font:20px/1 'DotGothic16','Nanum Gothic Coding',monospace;letter-spacing:1px;color:var(--lab)}
.led{width:8px;height:8px;border-radius:50%;background:rgba(120,70,85,.18);box-shadow:inset 0 1px 1px rgba(120,70,85,.3)}
.dev.on .led{background:var(--led);box-shadow:0 0 8px var(--led)}
.lcd{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;padding:10px 12px;border-radius:10px;background:var(--lcd);color:var(--ink);font-family:'DotGothic16','Nanum Gothic Coding',monospace;box-shadow:inset 0 3px 8px rgba(120,70,85,.22),0 0 0 4px var(--edge),0 1px 0 5px rgba(255,255,255,.85)}
.lcd::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 2px,rgba(120,70,85,.05) 2px 3px)}
.st{display:flex;align-items:center;gap:8px;height:22px;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--dim);font-size:12px}
.st svg{width:12px;height:12px;fill:currentColor;display:block}
.sp{flex:1;text-align:center;letter-spacing:1px}
.bat{display:flex;gap:1px;width:19px;height:10px;padding:1px;border:1px solid currentColor;position:relative}
.bat i{flex:1;background:currentColor}
.bat::after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor}
.now{height:48px;overflow:hidden;margin-bottom:6px}
.t{font-size:17px;line-height:26px;white-space:nowrap;overflow:hidden}
.t span{display:inline-block;padding-right:40px}
.t.mq span{animation:mq 10s linear 1s infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.a{font-size:12px;line-height:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px}
.bar{flex:1;height:14px;padding:2px;border:1px solid var(--ink);position:relative;touch-action:none;cursor:pointer}
.bar::before{content:"";position:absolute;inset:-12px 0}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 4px)}
.ls{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;margin:0 -4px;padding-top:4px;border-top:1px solid var(--dim);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ls::-webkit-scrollbar{display:none}
.r{flex:none;display:flex;align-items:center;gap:8px;height:30px;padding:0 4px;font-size:14px;cursor:pointer}
.r .n{width:20px;font-size:12px;opacity:.6}
.r .m{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .d{font-size:12px;opacity:.7}
.r .x{min-width:28px;height:28px;display:grid;place-items:center;font-size:14px;opacity:.45}
.r .x.q{opacity:1;font-size:11px}
.r.cr{background:var(--hi);color:var(--ink)}
.r.cr .n,.r.cr .d,.r.cr .x{opacity:.95}
.dev.on .r.cr .n{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.none{margin:auto;font-size:20px;letter-spacing:2px;animation:bl 1.2s steps(1) infinite}
.ctl{display:grid;place-items:center;padding-top:2px}
.wh{position:relative;width:204px;height:204px;border-radius:50%;background:radial-gradient(circle at 35% 25%,var(--w1),var(--w2));box-shadow:0 0 0 1px var(--edge),0 6px 14px var(--sh),inset 0 2px 2px rgba(255,255,255,.6)}
.wh button{position:absolute;display:grid;place-items:center;padding:0;border:0;border-radius:12px;background:none;color:var(--lab);font:inherit;cursor:pointer}
.wh button:active{opacity:.45}
.wh svg{width:24px;height:24px;fill:currentColor;display:block}
.wh .bm{top:8px;left:50%;width:76px;height:48px;margin-left:-38px;font:12px/1 'DotGothic16',monospace;letter-spacing:2px}
.wh .bt{bottom:8px;left:50%;width:76px;height:48px;margin-left:-38px}
.wh .bp{left:8px;top:50%;width:48px;height:76px;margin-top:-38px}
.wh .bn{right:8px;top:50%;width:48px;height:76px;margin-top:-38px}
.wh .ba{left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border-radius:50%;background:radial-gradient(circle at 40% 30%,var(--b1),var(--b2));box-shadow:0 0 0 1px var(--edge),0 1px 3px var(--sh),inset 0 1px 1px rgba(255,255,255,.6)}
.wh .ba svg{width:28px;height:28px}
.dev .on-only{display:none}
.dev.on .on-only{display:block}
.dev.on .off-only{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM20 5v14L8.5 12z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M16.5 5H19v14h-2.5zM4 5l11.5 7L4 19z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M10.5 4h3v6.5H20v3h-6.5V20h-3v-6.5H4v-3h6.5z"/></symbol>
</svg>
<main class="dev">
  <div class="top"><span class="brand">mp3★</span><i class="led"></i></div>
  <section class="lcd">
    <div class="st">
      <svg class="on-only"><use href="#i-play"/></svg><svg class="off-only"><use href="#i-pause"/></svg>
      <span class="sp">ALL</span><span class="ix">00/00</span><span class="bat"><i></i><i></i><i></i></span>
    </div>
    <div class="now"><div class="t"></div><div class="a"></div></div>
    <div class="pg"><span class="cu">00:00</span><div class="bar"><i></i></div><span class="du">00:00</span></div>
    <div class="ls"></div>
  </section>
  <div class="ctl"><div class="wh">
    <button class="bm" aria-label="mode">MODE</button>
    <button class="bp" aria-label="prev"><svg><use href="#i-prev"/></svg></button>
    <button class="bn" aria-label="next"><svg><use href="#i-next"/></svg></button>
    <button class="bt" aria-label="play"><svg class="off-only"><use href="#i-play"/></svg><svg class="on-only"><use href="#i-pause"/></svg></button>
    <button class="ba" aria-label="add"><svg><use href="#i-plus"/></svg></button>
  </div></div>
  <input type="file" id="f" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus" multiple hidden>
</main>
<script>
const $=s=>document.querySelector(s);
const el={dev:$('.dev'),ls:$('.ls'),t:$('.t'),a:$('.a'),bar:$('.bar'),fill:$('.bar i'),cu:$('.cu'),du:$('.du'),sp:$('.sp'),ix:$('.ix'),f:$('#f')};
const au=new Audio(),M=['ALL','ONE','SHF'],pad=n=>String(n).padStart(2,'0');
let db,songs=[],cur=-1,url='',mode=0,arm=-1,ft;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return pad(s/60|0)+':'+pad(s%60)};
const P=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=m=>db.transaction(['songs','blobs'],m);
const done=t=>new Promise((ok,no)=>{t.oncomplete=ok;t.onerror=t.onabort=()=>no(t.error)});
const openDB=()=>P(Object.assign(indexedDB.open('mp3',1),{onupgradeneeded(e){const d=e.target.result;d.createObjectStore('songs',{keyPath:'id'});d.createObjectStore('blobs')}}));
function flash(m){el.sp.textContent=m;clearTimeout(ft);ft=setTimeout(()=>el.sp.textContent=M[mode],1600)}
function save(){try{localStorage.setItem('mp3',JSON.stringify({id:songs[cur]?.id,m:mode}))}catch(e){}}
const getDur=b=>new Promise(ok=>{const a=new Audio(),u=URL.createObjectURL(b),end=v=>{URL.revokeObjectURL(u);ok(v)};a.preload='metadata';a.onloadedmetadata=()=>end(isFinite(a.duration)?a.duration:0);a.onerror=()=>end(0);setTimeout(()=>end(0),5000);a.src=u});

function head(){
  const s=songs[cur],sp=document.createElement('span');
  sp.textContent=s?s.t:'';el.t.replaceChildren(sp);el.t.classList.remove('mq');
  el.a.textContent=s?(s.ar||'—'):'';
  el.ix.textContent=songs.length?pad(cur+1)+'/'+pad(songs.length):'00/00';
  el.du.textContent=fmt(s?s.dur:0);
  requestAnimationFrame(()=>el.t.classList.toggle('mq',sp.offsetWidth-40>el.t.clientWidth));
  [...el.ls.children].forEach((r,i)=>r.classList.toggle('cr',i===cur));
}
function render(){
  const y=el.ls.scrollTop;el.ls.textContent='';
  if(!songs.length){const n=document.createElement('div');n.className='none';n.textContent='NO FILE';el.ls.append(n)}
  songs.forEach((s,i)=>{
    const r=document.createElement('div');r.className='r';
    r.innerHTML='<span class="n">'+pad(i+1)+'</span><span class="m"></span><span class="d">'+(s.dur?fmt(s.dur):'')+'</span><span class="x">×</span>';
    r.children[1].textContent=(s.ar?s.ar+' - ':'')+s.t;
    r.onclick=e=>e.target.classList.contains('x')?del(i,e.target):play(i);
    el.ls.append(r);
  });
  el.ls.scrollTop=y;head();
}
async function play(i,go=true){
  const s=songs[i];if(!s)return;cur=i;head();
  try{
    const b=await P(tx('readonly').objectStore('blobs').get(s.id));if(!b)throw 0;
    if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);au.src=url;
    el.fill.style.width='0';el.cu.textContent='00:00';
    el.ls.children[i]?.scrollIntoView({block:'nearest'});
    if(go)await au.play();
  }catch(e){if(!e||e.name!=='AbortError')flash('ERR')}
  if('mediaSession' in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:s.t,artist:s.ar||'',album:'mp3★'});
  save();
}
function next(auto){
  const n=songs.length;if(!n)return;
  if(auto&&mode===1){au.currentTime=0;au.play();return}
  let i=(cur+1)%n;
  if(mode===2&&n>1)do i=Math.random()*n|0;while(i===cur);
  play(i);
}
function prev(){
  if(!songs.length)return;if(cur<0)return play(0);
  if(au.currentTime>3){au.currentTime=0;return}
  play((cur-1+songs.length)%songs.length);
}
function toggle(){
  if(cur<0)return songs.length?play(0):el.f.click();
  if(!au.src)return play(cur);
  au.paused?au.play().catch(()=>{}):au.pause();
}
function del(i,x){
  if(arm!==i){arm=i;x.textContent='DEL?';x.classList.add('q');setTimeout(()=>{if(arm===i){arm=-1;x.textContent='×';x.classList.remove('q')}},2500);return}
  arm=-1;remove(i);
}
async function remove(i){
  const s=songs[i];
  try{const t=tx('readwrite');t.objectStore('songs').delete(s.id);t.objectStore('blobs').delete(s.id);await done(t)}catch(e){return flash('ERR')}
  songs.splice(i,1);
  if(i===cur){au.pause();au.removeAttribute('src');au.load();if(url){URL.revokeObjectURL(url);url=''}cur=-1;el.fill.style.width='0';el.cu.textContent='00:00'}
  else if(i<cur)cur--;
  render();save();
}
el.f.onchange=async()=>{
  const fs=[...el.f.files];el.f.value='';let n=0;
  for(const f of fs){
    if(!(f.type.startsWith('audio')||/\.(mp3|m4a|aac|flac|wav|ogg|opus)$/i.test(f.name)))continue;
    if(songs.some(s=>s.file===f.name&&s.size===f.size))continue;
    flash(pad(n+1)+'/'+pad(fs.length));
    try{
      const nm=f.name.replace(/\.[^.]+$/,'').replace(/_/g,' ').trim(),p=nm.split(' - ');
      const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),file:f.name,size:f.size,ar:p.length>1?p[0]:'',t:p.length>1?p.slice(1).join(' - '):nm,dur:await getDur(f),at:Date.now()};
      const t=tx('readwrite');t.objectStore('songs').put(rec);t.objectStore('blobs').put(f,rec.id);await done(t);
      songs.push(rec);n++;
    }catch(e){flash('ERR')}
  }
  if(n){render();if(cur<0)play(0,false);flash('+'+n)}
};
au.onplay=au.onpause=()=>{el.dev.classList.toggle('on',!au.paused);try{navigator.mediaSession.playbackState=au.paused?'paused':'playing'}catch(e){}};
au.ontimeupdate=()=>{
  const d=au.duration||0;
  el.fill.style.width=d?au.currentTime/d*100+'%':'0';el.cu.textContent=fmt(au.currentTime);
  try{navigator.mediaSession.setPositionState({duration:d,position:Math.min(au.currentTime,d),playbackRate:1})}catch(e){}
};
au.onloadedmetadata=()=>{if(isFinite(au.duration))el.du.textContent=fmt(au.duration)};
au.onended=()=>next(true);
au.onerror=()=>{if(au.src)flash('ERR')};
const seek=e=>{const r=el.bar.getBoundingClientRect(),d=au.duration||0;if(d)au.currentTime=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width))*d};
el.bar.onpointerdown=e=>{el.bar.setPointerCapture(e.pointerId);seek(e);el.bar.onpointermove=seek};
el.bar.onpointerup=el.bar.onpointercancel=()=>{el.bar.onpointermove=null};
$('.bm').onclick=()=>{mode=(mode+1)%3;flash(M[mode]);save()};
$('.bp').onclick=prev;$('.bn').onclick=()=>next();$('.bt').onclick=toggle;$('.ba').onclick=()=>el.f.click();
[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',prev],['nexttrack',()=>next()],['seekto',d=>{au.currentTime=d.seekTime}]].forEach(([a,h])=>{try{navigator.mediaSession.setActionHandler(a,h)}catch(e){}});
(async()=>{
  try{db=await openDB();songs=(await P(tx('readonly').objectStore('songs').getAll())).sort((a,b)=>a.at-b.at);navigator.storage?.persist?.()}catch(e){flash('ERR')}
  let st={};try{st=JSON.parse(localStorage.getItem('mp3')||'{}')}catch(e){}
  if(st.m>=0&&st.m<3)mode=st.m;
  el.sp.textContent=M[mode];render();
  const k=songs.findIndex(s=>s.id===st.id);if(k>=0)play(k,false);
})();
</script>
</body>
</html>
